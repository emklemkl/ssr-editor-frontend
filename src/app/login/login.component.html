<div class="login-container">
    <h2>Logga in</h2>
    <form (ngSubmit)="onLogin()">
      <div class="form-group">
        <label for="email">E-post:</label>
        <input
          type="email"
          id="email"
          [(ngModel)]="email"
          name="email"
          required
          placeholder="Ange din e-post"
        />
      </div>
  
      <div class="form-group">
        <label for="password">Lösenord:</label>
        <input
          type="password"
          id="password"
          [(ngModel)]="password"
          name="password"
          required
          placeholder="Ange ditt lösenord"
        />
      </div>
  
      <button type="submit">Logga in</button>

      <p>Har du inget konto? Klicka nedan för att registrera dig.</p>
      <button type="button" (click)="goToRegister()">Registrera konto</button>
  
      <div *ngIf="errorMessage" class="error-message">
        {{ errorMessage }}
      </div>
    </form>
  </div>
