<section class="" *ngIf="document$ | async as document">
    <input type="text" (input)="submitUpdateDoc()" [(ngModel)]="currentDocument.title" placeholder="Title" />
    <textarea
        type="text"
        (input)="submitUpdateDoc()"
        [(ngModel)]="currentDocument.content"
        name="text-content"
    ></textarea>
    <button (click)="submitUpdateDoc()" class="submit-button">Update</button>
</section>

<button (click)="openShareModal()">Dela dokument</button>

<div *ngIf="isShareModalOpen" class="modal">
    <h2>Dela dokument</h2>
    <input type="email" [(ngModel)]="inviteEmail" placeholder="Ange e-postadress">
    <button (click)="sendInvitation()">Skicka inbjudan</button>
    <button (click)="closeShareModal()">Avbryt</button>
</div>
